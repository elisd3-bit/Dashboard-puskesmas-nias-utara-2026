<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Puskesmas Nias Utara 2026</title>
  <style>
    :root{--navy:#0b3558;--blue:#1478b8;--cyan:#36b8c7;--green:#1e9f75;--bg:#f3f7fa;--card:#fff;--text:#17324a;--muted:#668095;--danger:#dc5b5b;--shadow:0 12px 32px rgba(11,53,88,.10)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.hero{background:linear-gradient(130deg,var(--navy),#12699c 65%,var(--cyan));color:#fff;padding:34px max(24px,calc((100vw - 1220px)/2)) 58px}.hero h1{margin:0;font-size:clamp(28px,4vw,48px);letter-spacing:-.03em}.hero p{margin:9px 0 0;opacity:.88}.wrap{max-width:1220px;margin:-30px auto 60px;padding:0 22px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.summary article,.panel,.card,.modal-box{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}.summary article{padding:20px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}.big{font-size:30px;font-weight:800;margin-top:6px}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:24px 0 16px}.toolbar h2{margin:0}.search{width:min(360px,52vw);border:1px solid #d7e3eb;border-radius:999px;padding:12px 18px;font-size:15px;outline:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:19px;cursor:pointer;border:1px solid transparent;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#a9dce2}.card-head{display:flex;justify-content:space-between;gap:10px}.card h3{margin:0;font-size:18px}.badge{height:max-content;background:#e8f7f3;color:#117556;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.meta{color:var(--muted);font-size:13px;margin:6px 0 16px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f3f8fb;border-radius:12px;padding:10px}.metric strong{display:block;font-size:18px}.metric span{font-size:11px;color:var(--muted)}.risk{display:flex;gap:8px;margin-top:13px}.pill{font-size:11px;padding:5px 8px;border-radius:9px;background:#eef4f8}.pill.red{background:#fff0f0;color:#a73737}.panel{margin-top:22px;padding:22px}.bars{display:grid;gap:9px;margin-top:15px}.bar-row{display:grid;grid-template-columns:145px 1fr 72px;gap:10px;align-items:center;font-size:13px}.track{height:11px;background:#e9f0f4;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}.modal{display:none;position:fixed;inset:0;background:rgba(4,24,39,.62);padding:24px;overflow:auto;z-index:10}.modal.open{display:flex;align-items:flex-start;justify-content:center}.modal-box{width:min(920px,100%);margin:auto;padding:25px;position:relative}.close{position:absolute;right:18px;top:14px;border:0;background:#edf3f6;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:18px 0}.section{margin-top:20px}.section h3{font-size:15px;margin:0 0 10px;color:var(--navy)}.table{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#dbe6ec;border:1px solid #dbe6ec;border-radius:12px;overflow:hidden}.table div{background:#fff;padding:10px 12px;font-size:13px}.table div:nth-child(odd){color:var(--muted)}.source{display:inline-block;margin-top:18px;color:var(--blue);font-weight:700;text-decoration:none}.empty{text-align:center;color:var(--muted);padding:40px}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.hero{padding-top:26px}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}.bar-row{grid-template-columns:105px 1fr 54px}.modal{padding:10px}.modal-box{padding:20px 15px}.summary article{padding:15px}.big{font-size:25px}}
  </style>
</head>
<body>
  <header class="hero"><h1>Dashboard Puskesmas</h1><p>Kabupaten Nias Utara · Profil dan indikator pelayanan tahun 2026</p></header>
  <main class="wrap">
    <section class="summary" id="summary"></section>
    <section class="panel"><div class="kicker">Perbandingan wilayah kerja</div><div class="big" style="font-size:22px">Jumlah penduduk per puskesmas</div><div class="bars" id="bars"></div></section>
    <div class="toolbar"><h2>11 Puskesmas</h2><input id="search" class="search" placeholder="Cari nama puskesmas…"></div>
    <section class="grid" id="cards"></section>
    <div class="foot">Sumber: dokumen profil UPTD Puskesmas Kabupaten Nias Utara yang diberikan pengguna. Nilai kosong ditandai “Belum tersedia”.</div>
  </main>
  <div class="modal" id="modal"><div class="modal-box"><button class="close" id="close">×</button><div id="detail"></div></div></div>
  <script>
  const data=[
    {name:'Lotu',accr:'Paripurna',cat:'Terpencil',pop:14011,hh:3202,villages:13,pustu:4,posyandu:22,poskesdes:7,pregnant:80,babies:160,preschool:1457,school:3558,adult:8000,elderly:882,inpatient:14,outpatient:274,tb:8,tbContact:24,stunting:22,ckg:1852,maternal:0,infantDeath:6,url:'https://docs.google.com/document/d/1oazhMJQ78BkpEeJV_T4YpMLfOFGqiN1LXh2ZrSCDCPI/edit'},
    {name:'Lahewa Timur',accr:'Madya',cat:'Terpencil',pop:10298,hh:2453,villages:7,pustu:1,posyandu:18,poskesdes:4,pregnant:5,babies:35,preschool:18,school:7,adult:119,elderly:16,inpatient:10,outpatient:200,tb:5,tbContact:5,stunting:7,ckg:214,maternal:0,infantDeath:0,url:'https://docs.google.com/document/d/1X9jdnZCE2Sh8bbnq_gBIwgjjiNWrubL4DiLdFDoT76M/edit'},
    {name:'Lahewa',accr:'Paripurna',cat:'Terpencil',pop:27409,hh:5736,villages:21,pustu:6,posyandu:39,poskesdes:10,pregnant:88,babies:225,preschool:943,school:5311,adult:null,elderly:1077,inpatient:40,outpatient:137,tb:3,tbContact:11,stunting:8,ckg:2103,maternal:2,infantDeath:3,url:'https://docs.google.com/document/d/18UOKk7WXXDiW1ZwTOPTXEFdXdix3EouB3fD4oMzpI_g/edit'},
    {name:'Afulu',accr:'Paripurna',cat:'Sangat Terpencil',pop:13843,hh:2436,villages:9,pustu:5,posyandu:14,poskesdes:5,pregnant:21,babies:95,preschool:null,school:1427,adult:3031,elderly:689,inpatient:11,outpatient:181,tb:6,tbContact:10,stunting:4,ckg:102,maternal:0,infantDeath:0,url:'https://docs.google.com/document/d/1pvFWP6xEl_pB3id4muPPMyAtUchdOumFOpH-kaCRg-Q/edit'},
    {name:'Namohalu Esiwa',accr:'Paripurna',cat:'Tidak Terpencil',pop:15880,hh:4171,villages:11,pustu:5,posyandu:22,poskesdes:7,pregnant:49,babies:126,preschool:586,school:2049,adult:294,elderly:377,inpatient:15,outpatient:374,tb:6,tbContact:10,stunting:1,ckg:246,maternal:0,infantDeath:0,url:'https://docs.google.com/document/d/1Hn9ozdnYZNJ1lGpv3Ls1e6jR05IXFWWVEiahmTHCTJo/edit'},
    {name:'Sawo',accr:'Utama',cat:'Terpencil',pop:11669,hh:1565,villages:10,pustu:2,posyandu:21,poskesdes:8,pregnant:40,babies:103,preschool:610,school:2825,adult:6379,elderly:504,inpatient:24,outpatient:153,tb:9,tbContact:88,stunting:15,ckg:1843,maternal:0,infantDeath:0,url:'https://docs.google.com/document/d/1oRRicR5fzF8S10ePGGm3rSBQHn_t6j33f5Mf-8xubSM/edit'},
    {name:'Tuhemberua',accr:'Paripurna',cat:'Terpencil',pop:13375,hh:2980,villages:8,pustu:1,posyandu:23,poskesdes:8,pregnant:203,babies:165,preschool:756,school:2999,adult:2954,elderly:954,inpatient:11,outpatient:314,tb:8,tbContact:30,stunting:8,ckg:120,maternal:0,infantDeath:0,url:'https://docs.google.com/document/d/1_akwDYpL0a6jAgTaUB-Lo-OIeeQUMbvwOtYSfNR8Guo/edit'},
    {name:'Alasa Talumuzoi',accr:'Utama',cat:'Terpencil',pop:7008,hh:1661,villages:6,pustu:5,posyandu:8,poskesdes:3,pregnant:14,babies:180,preschool:515,school:1576,adult:132,elderly:64,inpatient:3,outpatient:154,tb:3,tbContact:8,stunting:6,ckg:49,maternal:0,infantDeath:null,url:'https://docs.google.com/document/d/10nxPCHG6PhItrIRZO5OncCxJtk4f9EW1e_QZ_sxuu1c/edit'},
    {name:'Alasa',accr:'Paripurna',cat:'Terpencil',pop:19115,hh:4462,villages:14,pustu:4,posyandu:22,poskesdes:10,pregnant:49,babies:155,preschool:1137,school:4962,adult:null,elderly:null,inpatient:11,outpatient:354,tb:null,tbContact:null,stunting:null,ckg:null,maternal:1,infantDeath:1,url:'https://docs.google.com/document/d/1w_Jjd93R44S6Myr8IaKiCYVXlOpqzicD-8sil6zUvXs/edit'},
    {name:'Tugala Oyo',accr:'Paripurna',cat:'Sangat Terpencil',pop:11575,hh:3352,villages:8,pustu:2,posyandu:14,poskesdes:3,pregnant:58,babies:47,preschool:443,school:1351,adult:4190,elderly:542,inpatient:4,outpatient:300,tb:12,tbContact:24,stunting:2,ckg:2270,maternal:0,infantDeath:null,url:'https://docs.google.com/document/d/1IWFsQzzr4WcjRO_13_tWsMYgnLUOcBFISl9QjkwPpZM/edit'},
    {name:'Awa’ai',accr:'Paripurna',cat:'Terpencil',pop:14001,hh:3223,villages:6,pustu:4,posyandu:22,poskesdes:4,pregnant:204,babies:298,preschool:825,school:1799,adult:1857,elderly:646,inpatient:9,outpatient:379,tb:21,tbContact:82,stunting:7,ckg:5453,maternal:0,infantDeath:1,url:'https://docs.google.com/document/d/1lBTlmxwS4AX6RWHr9i_LobwbF9nm5RqOBrRou8jk4P8/edit'}
  ];
  const fmt=n=>n==null?'Belum tersedia':new Intl.NumberFormat('id-ID').format(n); const sum=k=>data.reduce((a,x)=>a+(x[k]||0),0);
  document.getElementById('summary').innerHTML=[['Puskesmas',data.length],['Total penduduk',fmt(sum('pop'))],['Total Posyandu',fmt(sum('posyandu'))],['Balita stunting*',fmt(sum('stunting'))]].map(x=>`<article><div class="kicker">${x[0]}</div><div class="big">${x[1]}</div></article>`).join('');
  const max=Math.max(...data.map(x=>x.pop)); document.getElementById('bars').innerHTML=[...data].sort((a,b)=>b.pop-a.pop).map(x=>`<div class="bar-row"><span>${x.name}</span><div class="track"><div class="fill" style="width:${x.pop/max*100}%"></div></div><strong>${fmt(x.pop)}</strong></div>`).join('');
  const cards=document.getElementById('cards');
  function render(q=''){const list=data.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));cards.innerHTML=list.length?list.map((x,i)=>`<article class="card" data-name="${x.name}"><div class="card-head"><h3>${x.name}</h3><span class="badge">${x.accr}</span></div><div class="meta">Rawat inap · ${x.cat}</div><div class="metrics"><div class="metric"><strong>${fmt(x.pop)}</strong><span>Penduduk</span></div><div class="metric"><strong>${fmt(x.outpatient)}</strong><span>Rawat jalan/bln</span></div><div class="metric"><strong>${fmt(x.posyandu)}</strong><span>Posyandu</span></div><div class="metric"><strong>${fmt(x.ckg)}</strong><span>Cek kesehatan</span></div></div><div class="risk"><span class="pill ${x.stunting>10?'red':''}">Stunting: ${fmt(x.stunting)}</span><span class="pill ${x.tb>10?'red':''}">TB: ${fmt(x.tb)}</span></div></article>`).join(''):'<div class="empty">Puskesmas tidak ditemukan.</div>';document.querySelectorAll('.card').forEach(el=>el.onclick=()=>openDetail(data.find(x=>x.name===el.dataset.name)))}
  function openDetail(x){const pairs=[['Jumlah desa',x.villages],['Rumah tangga',x.hh],['Pustu',x.pustu],['Posyandu',x.posyandu],['Poskesdes',x.poskesdes],['Ibu hamil',x.pregnant],['Bayi',x.babies],['Balita & pra sekolah',x.preschool],['Usia sekolah & remaja',x.school],['Usia dewasa',x.adult],['Lanjut usia',x.elderly],['Rawat inap/bulan',x.inpatient],['Rawat jalan/bulan',x.outpatient],['Pasien TB',x.tb],['Investigasi kontak TB',x.tbContact],['Balita stunting',x.stunting],['Capaian CKG',x.ckg],['Kematian ibu',x.maternal],['Kematian bayi',x.infantDeath]];document.getElementById('detail').innerHTML=`<div class="kicker">UPTD Puskesmas</div><h2 style="font-size:30px;margin:4px 0">${x.name}</h2><div class="meta">Akreditasi ${x.accr} · Kawasan ${x.cat} · Rawat inap</div><div class="detail-grid"><div class="metric"><strong>${fmt(x.pop)}</strong><span>Penduduk</span></div><div class="metric"><strong>${fmt(x.hh)}</strong><span>Rumah tangga</span></div><div class="metric"><strong>${fmt(x.villages)}</strong><span>Desa/kelurahan</span></div><div class="metric"><strong>${fmt(x.posyandu)}</strong><span>Posyandu</span></div></div><div class="section"><h3>Indikator profil dan pelayanan</h3><div class="table">${pairs.map(p=>`<div>${p[0]}</div><div><strong>${fmt(p[1])}</strong></div>`).join('')}</div></div><a class="source" href="${x.url}" target="_blank" rel="noopener">Buka dokumen sumber ↗</a>`;document.getElementById('modal').classList.add('open')}
  document.getElementById('search').oninput=e=>render(e.target.value);document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};render();
  </script>
</body>
</html>
